# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Networking Capstone (LAB). Graded against the live cluster. UNTESTED.
# The policy checks need a network plugin that enforces NetworkPolicy.
apiVersion: astrona.io/v1
metadata:
  name: ats-038-capstone-010
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

# Starting state: orbit with beacon (2 Pods), a faulty Service, a relay client,
# and a drifter client in outpost. The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the orbit workloads and the faulty Service
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: beacon-service-fixed
      description: Service beacon has ready endpoints and relay reaches it
      type: file
      source: validation/validate-beacon-service-fixed.sh
      hint: Compare the Service selector with the Pod labels, and use the container port name http as the targetPort.
    - name: beacon-pods-headless
      description: beacon-pods is a headless Service for the beacon Pods
      type: file
      source: validation/validate-beacon-pods-headless.sh
      hint: Set clusterIP to None, select app=beacon, and use the container port 9898 as the Service port.
    - name: beacon-external-nodeport
      description: beacon-external is a NodePort Service on port 30090
      type: file
      source: validation/validate-beacon-external-nodeport.sh
      hint: Set type NodePort, select app=beacon and set nodePort to 30090.
    - name: beacon-allows-relay
      description: relay reaches the beacon Pod on 9898
      type: file
      source: validation/validate-beacon-allows-relay.sh
      hint: The ingress rule must allow Pods with app=relay on TCP 9898, the container port.
    - name: beacon-blocks-drifter
      description: drifter cannot reach the beacon Pod
      type: file
      source: validation/validate-beacon-blocks-drifter.sh
      hint: Isolate the beacon Pods for ingress with a NetworkPolicy that lists only the relay Pods.

teardown:
  keepCluster: false
