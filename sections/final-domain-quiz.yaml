- id: ats038-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain that each Pod has one IP address that its containers
    share, and that the address changes when the Pod is replaced
  source_readings:
  - sections/section-010/module-01/course-01-pod-addresses-and-network-implementation.md
  prompt: A Pod runs two containers. One container must call the other. Which statement
    is correct?
  options:
  - id: a
    text: The containers have separate IP addresses, so the caller needs a Service.
    explanation: Containers in one Pod share one network namespace and one address.
      No Service is needed.
  - id: b
    text: The containers share the Pod network namespace and IP address, so the caller
      can use localhost.
    explanation: Correct. All containers in a Pod share one network namespace, so
      they reach each other on localhost, and they cannot listen on the same port.
  - id: c
    text: The containers share an address only when they run on different nodes.
    explanation: Sharing does not depend on the node. It comes from the shared network
      namespace of the Pod.
  - id: d
    text: The caller must use the node IP address and a node port.
    explanation: The node address is not needed for traffic inside one Pod.
  correct_option: b
  explanation: All containers in a Pod share one network namespace, so they reach
    each other on localhost, and they cannot listen on the same port.
- id: ats038-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain how a Service name resolves through CoreDNS, including
    the short, namespaced and fully qualified forms
  source_readings:
  - sections/section-010/module-01/course-03-dns-and-service-discovery-in-practice.md
  prompt: A Pod in `outpost` sends a request to `http://probe/get`. The Service `probe`
    exists only in `starfleet`. What happens?
  options:
  - id: a
    text: The request works, because CoreDNS searches every namespace.
    explanation: The search list contains only the namespace of the client Pod, then
      svc and the cluster domain.
  - id: b
    text: The name fails to resolve, because the short name is searched in `outpost`
      first and `probe.outpost.svc.cluster.local` does not exist.
    explanation: Correct. The resolver appends the search suffixes of the client namespace.
      `probe.starfleet` or the fully qualified name works from `outpost`.
  - id: c
    text: The request reaches the Pod directly with its IP address.
    explanation: No address is involved. The failure happens during name resolution.
  - id: d
    text: The request works only when the Service is headless.
    explanation: The Service type does not change the search rules.
  correct_option: b
  explanation: The resolver appends the search suffixes of the client namespace. `probe.starfleet`
    or the fully qualified name works from `outpost`.
- id: ats038-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Diagnose a Service that has endpoints but refuses connections
  source_readings:
  - sections/section-010/module-02/course-01-selectors-ports-and-backends.md
  prompt: A Service has a ready endpoint with the Pod address, but every request fails
    with `Connection refused`. Which field should you check?
  options:
  - id: a
    text: The `targetPort`, which must be the port on which the container listens.
    explanation: Correct. The endpoint exists, so the Service reached the Pod. A wrong
      targetPort sends the request to a port with no listener.
  - id: b
    text: The `ingressClassName` of the Service.
    explanation: A Service has no ingressClassName. That field belongs to an Ingress.
  - id: c
    text: The `externalName` of the Service.
    explanation: ExternalName Services have no endpoints.
  - id: d
    text: The `clusterIP` of the Service.
    explanation: The cluster IP is allocated by the control plane and is not related
      to the listener.
  correct_option: a
  explanation: The endpoint exists, so the Service reached the Pod. A wrong targetPort
    sends the request to a port with no listener.
- id: ats038-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish an Ingress from a Service and from an Ingress controller
  source_readings:
  - sections/section-010/module-02/course-03-external-entry-and-application-routing.md
  prompt: An Ingress object exists, and its address stays empty. Which cause fits
    best?
  options:
  - id: a
    text: No Ingress controller is running that serves the Ingress class.
    explanation: Correct. An Ingress is only data. A controller must read it, configure
      a proxy and report the address.
  - id: b
    text: The backend Service has the type ClusterIP.
    explanation: A ClusterIP backend is the normal case for an Ingress.
  - id: c
    text: The Pods are on different nodes.
    explanation: Pod placement does not decide the Ingress address.
  - id: d
    text: The Ingress uses pathType Prefix.
    explanation: Prefix is a valid path type.
  correct_option: a
  explanation: An Ingress is only data. A controller must read it, configure a proxy
    and report the address.
- id: ats038-final-q05
  type: single_choice
  difficulty: advanced
  learning_objective: Write an egress policy that includes DNS and predict whether
    a connection works with both directions
  source_readings:
  - sections/section-010/module-03/course-02-egress-rules-and-both-directions.md
  prompt: A default-deny egress policy is applied to a client Pod, and one rule allows
    TCP 9898 to the `scout` Pods. The client calls `http://scout.starfleet/healthz`
    and fails at once with a resolution error. What is missing?
  options:
  - id: a
    text: An ingress rule on the client.
    explanation: Ingress rules on the client do not affect its DNS queries.
  - id: b
    text: A rule that allows UDP and TCP port 53 to the cluster DNS Pods.
    explanation: Correct. The DNS query is egress traffic. Without a DNS rule the
      name never resolves.
  - id: c
    text: A rule that allows port 80, the Service port.
    explanation: Rules match the Pod port, not the Service port. Port 80 is not needed.
  - id: d
    text: A rule for the Ingress controller.
    explanation: Ingress controllers are not involved.
  correct_option: b
  explanation: The DNS query is egress traffic. Without a DNS rule the name never
    resolves.
- id: ats038-final-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish authentication, authorization and admission, and
    say which failure returns which status code
  source_readings:
  - sections/section-020/module-01/course-01-api-request-checks-and-workload-identity.md
  prompt: A request to the API server returns `403 Forbidden`. Which check refused
    it, and what is the right kind of fix?
  options:
  - id: a
    text: Authentication refused it, so the credential must be replaced.
    explanation: A failed authentication returns `401 Unauthorized`, not `403`.
  - id: b
    text: Authorization refused it, so a rule must allow the user, verb, resource
      and namespace.
    explanation: Correct. The API server knew the caller, and no rule allowed the
      request.
  - id: c
    text: Admission refused it, so the object content must change.
    explanation: An admission rejection names the controller or policy and the field
      that broke the rule, and it does not use a plain RBAC message.
  - id: d
    text: etcd refused it, so the cluster database must be restored.
    explanation: etcd stores objects after all checks pass and does not decide access.
  correct_option: b
  explanation: Correct. The API server knew the caller, and no rule allowed the request.
- id: ats038-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Choose between Role and ClusterRole, and between RoleBinding
    and ClusterRoleBinding
  source_readings:
  - sections/section-020/module-01/course-02-rbac-scope-and-least-privilege.md
  prompt: The built-in `view` ClusterRole must give the service account `drifter`
    read access in the namespace `outpost` only. Which setup is correct?
  options:
  - id: a
    text: A `ClusterRoleBinding` from `drifter` to `view`.
    explanation: This grants the rules in every namespace.
  - id: b
    text: A `RoleBinding` in `outpost` from `drifter` to the `view` ClusterRole.
    explanation: Correct. A `RoleBinding` limits a ClusterRole's rules to its own
      namespace.
  - id: c
    text: A `Role` named `view` in `starfleet`.
    explanation: A Role in another namespace does not apply to `outpost`.
  - id: d
    text: A `ClusterRole` bound with a `RoleBinding` in `kube-system`.
    explanation: The binding grants access only in `kube-system`.
  correct_option: b
  explanation: Correct. A `RoleBinding` limits a ClusterRole's rules to its own namespace.
- id: ats038-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Check what an identity can do with kubectl auth can-i
  source_readings:
  - sections/section-020/module-01/course-03-diagnosing-and-tightening-access.md
  prompt: Which command shows everything the service account `drifter` in `outpost`
    may do in the namespace `outpost`?
  options:
  - id: a
    text: "`kubectl auth can-i --list -n outpost --as=system:serviceaccount:outpost:drifter`"
    explanation: Correct. `--list` prints every allowed resource and verb for that
      identity.
  - id: b
    text: "`kubectl auth whoami`"
    explanation: This prints the identity of the current credential, not the permissions
      of another account.
  - id: c
    text: "`kubectl get rolebindings -n outpost`"
    explanation: This lists bindings but does not show the combined effective permissions.
  - id: d
    text: "`kubectl describe serviceaccount drifter -n outpost`"
    explanation: This shows the account's details, not its permissions.
  correct_option: a
  explanation: Correct. `--list` prints every allowed resource and verb for that identity.
- id: ats038-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Enforce a level on a namespace and explain the enforce, audit
    and warn modes
  source_readings:
  - sections/section-020/module-02/course-03-enforcing-pod-security-levels.md
  prompt: A namespace has `pod-security.kubernetes.io/enforce=baseline` and `pod-security.kubernetes.io/warn=restricted`.
    A pod breaks only the restricted rules. What happens?
  options:
  - id: a
    text: The API server rejects the pod.
    explanation: The pod does not break baseline, so `enforce` does not reject it.
  - id: b
    text: The API server admits the pod and returns a warning to the client.
    explanation: Correct. The `warn` mode accepts the pod and warns the client.
  - id: c
    text: The API server admits the pod and stops existing pods.
    explanation: Pod Security admission never stops pods that already run.
  - id: d
    text: The kubelet refuses to start the pod.
    explanation: Pod Security admission runs in the API server, before the pod reaches
      a node.
  correct_option: b
  explanation: Correct. The `warn` mode accepts the pod and warns the client.
- id: ats038-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish an image vulnerability scan from a signature or
    digest check
  source_readings:
  - sections/section-020/module-02/course-02-credentials-and-image-supply-chains.md
  prompt: Which statement about checking an image is correct?
  options:
  - id: a
    text: A passing vulnerability scan proves that a trusted builder produced the
      image.
    explanation: A scan reads contents and says nothing about the builder.
  - id: b
    text: A valid signature proves that the software has no known vulnerabilities.
    explanation: A signature proves origin and integrity, and a signed image can still
      be vulnerable.
  - id: c
    text: A scan compares image contents with known flaws, and a signature verifies
      who built an exact digest.
    explanation: Correct. The two checks answer different questions.
  - id: d
    text: A tag such as `6.15.0` always names the same image content.
    explanation: A registry can move a tag. A digest names exactly one image.
  correct_option: c
  explanation: Correct. The two checks answer different questions.
- id: ats038-final-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Use pod phase, conditions and events to name the lifecycle stage
    where a pod stopped.
  source_readings:
  - sections/section-030/module-01/course-01-placement-and-dependency-evidence.md
  prompt: The pod `lander` stays `Pending`. `kubectl get pods -o wide` shows `<none>`
    in the `NODE` column. Which component has not finished its work, and where is
    the reason recorded?
  options:
  - id: a
    text: The kubelet, in the container logs.
    explanation: The kubelet only acts after a node is assigned. A pod with no node
      has no container and no logs.
  - id: b
    text: The scheduler, in a `FailedScheduling` event on the pod.
    explanation: The scheduler assigns a node. A pod with no node was not placed,
      and the scheduler records the reason in a `FailedScheduling` event.
  - id: c
    text: The container runtime, in the exit code.
    explanation: An exit code exists only for a container that has started, and this
      pod has no container.
  - id: d
    text: The Service controller, in the EndpointSlice.
    explanation: EndpointSlices list addresses of Ready pods behind a Service and
      do not explain placement.
  correct_option: b
  explanation: The scheduler assigns a node. A pod with no node was not placed, and
    the scheduler records the reason in a `FailedScheduling` event.
- id: ats038-final-q12
  type: single_choice
  difficulty: beginner
  learning_objective: Explain ErrImagePull, ImagePullBackOff, CrashLoopBackOff and
    OOMKilled, and find the exit code and the previous logs.
  source_readings:
  - sections/section-030/module-01/course-02-image-preparation-and-container-startup.md
  prompt: The pod status is `ImagePullBackOff`. The pod event says the manifest for
    `podinfo:6.15.999` was not found. What is the cause?
  options:
  - id: a
    text: The node has no free memory.
    explanation: Memory is not used for pulls, and this error names a manifest.
  - id: b
    text: The readiness probe path is wrong.
    explanation: Probes run after the image is pulled and the container starts.
  - id: c
    text: The tag does not exist in the registry.
    explanation: A manifest that is not found means the registry has no such tag or
      image. `ImagePullBackOff` is the wait before the next try.
  - id: d
    text: The container exits with code 1.
    explanation: A container exit code exists only for a container that has started.
  correct_option: c
  explanation: A manifest that is not found means the registry has no such tag or
    image. `ImagePullBackOff` is the wait before the next try.
- id: ats038-final-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what readiness, liveness and startup probes do and what
    a failing probe causes.
  source_readings:
  - sections/section-030/module-01/course-03-probes-and-safe-corrective-changes.md
  prompt: 'A pod is `Running` and shows `0/1` in the `READY` column. The events show
    `Readiness probe failed: HTTP probe failed with statuscode: 404`. What does the
    Kubernetes system do?'
  options:
  - id: a
    text: It restarts the container.
    explanation: Restarts are the result of a failing liveness probe, not of a readiness
      probe.
  - id: b
    text: It removes the pod from Service endpoints and does not restart it.
    explanation: A failing readiness probe makes the pod not Ready, so Services stop
      sending traffic to it. The container keeps running.
  - id: c
    text: It deletes the pod and its Deployment.
    explanation: No probe deletes a Deployment.
  - id: d
    text: It moves the pod to another node.
    explanation: Probes never move a pod to a node. Only a new pod can be scheduled
      elsewhere.
  correct_option: b
  explanation: A failing readiness probe makes the pod not Ready, so Services stop
    sending traffic to it. The container keeps running.
- id: ats038-final-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain how storage and resource pressure affect workloads.
  source_readings:
  - sections/section-030/module-02/course-01-node-health-and-shared-dependencies.md
  prompt: A pod mounts a claim and stays `Pending`. The claim is `Pending` and its
    event says the StorageClass `missing-class` was not found. Where is the fix?
  options:
  - id: a
    text: 'In CoreDNS: restart the pods.'
    explanation: DNS is not part of claim binding.
  - id: b
    text: 'In the node: add a taint.'
    explanation: A taint restricts scheduling and does not create storage.
  - id: c
    text: 'In the pod: raise its memory limit.'
    explanation: Memory limits do not affect binding a claim.
  - id: d
    text: 'In the claim: create it again with a StorageClass that exists.'
    explanation: The pod waits for the claim and the claim waits for a class that
      does not exist. A claim's `storageClassName` cannot be changed, so create the
      claim again with a valid class.
  correct_option: d
  explanation: The pod waits for the claim and the claim waits for a class that does
    not exist. A claim's `storageClassName` cannot be changed, so create the claim
    again with a valid class.
- id: ats038-final-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Separate DNS resolution from Service backend connectivity.
  source_readings:
  - sections/section-030/module-02/course-03-dns-resolution-and-debug-containers.md
  prompt: A client in `outpost` runs `curl http://scout` and gets exit code 6. The
    same request with `http://scout.starfleet` returns HTTP 200. What explains this?
  options:
  - id: a
    text: The node has `DiskPressure`.
    explanation: Node pressure does not change name resolution and would not make
      the second request succeed.
  - id: b
    text: The `scout` pod is not Ready.
    explanation: A pod that is not Ready would give a refused connection, not an unresolved
      host. The qualified name works.
  - id: c
    text: The Service has no endpoints.
    explanation: With no endpoints, the connection fails after the name resolves.
      Exit code 6 means the name did not resolve.
  - id: d
    text: A short Service name resolves only in the namespace of the client.
    explanation: The search list adds the client's own namespace, so `scout` becomes
      `scout.outpost.svc.cluster.local`, which does not exist. Adding the namespace
      fixes the lookup.
  correct_option: d
  explanation: The search list adds the client's own namespace, so `scout` becomes
    `scout.outpost.svc.cluster.local`, which does not exist. Adding the namespace
    fixes the lookup.
- id: ats038-final-q16
  type: single_choice
  difficulty: beginner
  learning_objective: Compare container-local, ephemeral and persistent storage lifecycles
  source_readings:
  - sections/section-040/module-01/course-01-container-filesystem-and-ephemeral-volumes.md
  prompt: A container in the `scout` Pod writes a file to `/tmp` and another to an
    `emptyDir` volume mounted at `/scratch`. The container process exits with an error
    and the kubelet restarts it in the same Pod. Which files exist afterwards?
  options:
  - id: a
    text: Only the file in `/tmp`.
    explanation: The container layer belongs to one container instance, so a restart
      deletes it.
  - id: b
    text: Both files.
    explanation: The file in `/tmp` was in the container layer, which the restart
      deletes.
  - id: c
    text: Only the file in `/scratch`.
    explanation: Correct. The `emptyDir` belongs to the Pod and survives a container
      restart. The writable container layer does not.
  - id: d
    text: Neither file.
    explanation: The `emptyDir` is kept while the Pod stays on the node.
  correct_option: c
  explanation: Correct. The `emptyDir` belongs to the Pod and survives a container
    restart. The writable container layer does not.
- id: ats038-final-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe StorageClass-based dynamic provisioning
  source_readings:
  - sections/section-040/module-01/course-03-storageclasses-provisioning-and-csi.md
  prompt: 'A claim uses a StorageClass with `volumeBindingMode: WaitForFirstConsumer`
    and no Pod uses the claim yet. What status does the claim show, and why?'
  options:
  - id: a
    text: "`Bound`, because the provisioner creates the volume at once."
    explanation: That is the `Immediate` mode.
  - id: b
    text: "`Lost`, because no volume exists."
    explanation: "`Lost` means the volume of a bound claim disappeared."
  - id: c
    text: "`Failed`, because no Pod uses it."
    explanation: Waiting for a Pod is normal and not a failure.
  - id: d
    text: "`Pending`, because the volume is created after the scheduler picks a node
      for a Pod that uses the claim."
    explanation: Correct. The volume is created where the Pod will run.
  correct_option: d
  explanation: Correct. The volume is created where the Pod will run.
- id: ats038-final-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why a StatefulSet uses volumeClaimTemplates
  source_readings:
  - sections/section-040/module-01/course-03-storageclasses-provisioning-and-csi.md
  prompt: A StatefulSet has 3 replicas and a `volumeClaimTemplates` entry named `data`.
    The Pod `probe-1` is deleted and re-created. Which volume does the new Pod mount?
  options:
  - id: a
    text: The claim `data-probe-1`, the same claim as before.
    explanation: Correct. The claim name contains the ordinal, so the replacement
      Pod finds its own data.
  - id: b
    text: A new empty claim, because the Pod is new.
    explanation: The StatefulSet controller reuses the existing claim.
  - id: c
    text: The claim `data-probe-0`, because it was created first.
    explanation: Each replica has its own claim.
  - id: d
    text: An `emptyDir`, because StatefulSets do not use claims.
    explanation: "`volumeClaimTemplates` creates one claim per replica."
  correct_option: a
  explanation: Correct. The claim name contains the ordinal, so the replacement Pod
    finds its own data.
- id: ats038-final-q19
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict Retain and Delete reclaim policy behavior
  source_readings:
  - sections/section-040/module-02/course-02-reclaim-policies-and-recovery.md
  prompt: A dynamically provisioned volume has the policy `Delete`. An administrator
    wants to keep its data before the claim is deleted. What is the correct step?
  options:
  - id: a
    text: 'Patch the PV with `persistentVolumeReclaimPolicy: Retain` before the claim
      is deleted.'
    explanation: Correct. The policy is a field of the PV and the control plane reads
      it when the claim is deleted.
  - id: b
    text: 'Patch the claim with `persistentVolumeReclaimPolicy: Retain`.'
    explanation: The field belongs to the PV, not the claim.
  - id: c
    text: Delete the claim first and patch the PV afterwards.
    explanation: With `Delete`, the PV and the storage are already removed.
  - id: d
    text: Delete the Pod, which switches the policy to `Retain`.
    explanation: Deleting a Pod never changes a reclaim policy.
  correct_option: a
  explanation: Correct. The policy is a field of the PV and the control plane reads
    it when the claim is deleted.
- id: ats038-final-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why persistence, replication and backup are different
    properties
  source_readings:
  - sections/section-040/module-02/course-03-expansion-snapshots-and-data-protection.md
  prompt: A table is dropped by mistake. The volume is on a replicated storage system,
    and the claim has the policy `Retain`. What restores the table?
  options:
  - id: a
    text: The replica, because replication keeps a second copy.
    explanation: Replication copies the deletion to the replica.
  - id: b
    text: The `Retain` policy, because it keeps the PV.
    explanation: "`Retain` keeps the volume, but the volume no longer holds the table."
  - id: c
    text: A backup taken before the mistake.
    explanation: Correct. A backup is a separate, older copy that recovers an earlier
      state.
  - id: d
    text: A larger claim through volume expansion.
    explanation: Expansion adds space and does not restore data.
  correct_option: c
  explanation: Correct. A backup is a separate, older copy that recovers an earlier
    state.
