# Access starting state: `auditor` has no permissions, and `drifter` is bound
# to the built-in `view` ClusterRole in every namespace (too broad, on purpose).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drifter-view
subjects:
  - kind: ServiceAccount
    name: drifter
    namespace: outpost
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
