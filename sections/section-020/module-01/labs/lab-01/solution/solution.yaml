# Reference solution: the corrected Role and the namespaced RoleBinding.
# apply.sh also deletes the ClusterRoleBinding and patches the shuttle pod template.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-lister
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drifter-view
  namespace: outpost
subjects:
  - kind: ServiceAccount
    name: drifter
    namespace: outpost
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
