# Faulty access starting state. The faults are left in place on purpose:
#  - Role pod-lister names the wrong API group, so it matches no pod rule.
#  - drifter is bound to `view` in every namespace by a ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-lister
  namespace: starfleet
rules:
  - apiGroups: ["apps"]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: probe-pod-lister
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: probe
    namespace: starfleet
roleRef:
  kind: Role
  name: pod-lister
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drifter-view
subjects:
  - kind: ServiceAccount
    name: drifter
    namespace: outpost
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
