# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Workload Security (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-038-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - busybox:1.37

# Starting state: the Starfleet workloads with no security context, shuttle
# reading the api-key Secret through an environment variable, and a privileged
# debug-tool in outpost. The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads, the Secret and the privileged debug-tool
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: scout-hardened
      description: The scout pod template sets the hardening fields
      type: file
      source: validation/validate-scout-hardened.sh
      hint: Set runAsNonRoot, a numeric runAsUser, allowPrivilegeEscalation false, readOnlyRootFilesystem true and capabilities drop ALL.
    - name: scout-still-serves
      description: shuttle still reaches scout after the change
      type: file
      source: validation/validate-scout-still-serves.sh
      hint: Wait for the rollout to finish. If the new pod fails, read its events with kubectl describe.
    - name: shuttle-secret-as-volume
      description: shuttle reads the api-key Secret from a read-only file
      type: file
      source: validation/validate-shuttle-secret-as-volume.sh
      hint: Remove the API_KEY variable. Add a secret volume for api-key and mount it read-only at /etc/api-key.
    - name: outpost-enforces-baseline
      description: outpost enforces the baseline Pod Security level
      type: file
      source: validation/validate-outpost-enforces-baseline.sh
      hint: Label the namespace pod-security.kubernetes.io/enforce=baseline.
    - name: debug-tool-unprivileged
      description: debug-tool runs without a privileged container
      type: file
      source: validation/validate-debug-tool-unprivileged.sh
      hint: Set privileged to false in the debug-tool pod template and wait for the new pod.

teardown:
  keepCluster: false
