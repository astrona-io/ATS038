# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Workload Security (PLAYGROUND) — playground environment.
# A clean sandbox: it starts, applies the Starfleet workloads and the workload
# security starting state, then stays running for free exploration. No task,
# no grading, no `astrona submit`. UNTESTED: built with static checks only.
apiVersion: astrona.io/v1
metadata:
  name: ats-038-playground-020-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - busybox:1.37

# What the learner starts with: the Starfleet workloads with no security
# context, a Secret `api-key` in starfleet, and a privileged `debug-tool`
# Deployment in outpost (on purpose). No Pod Security labels.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
    - name: extras
      type: file
      source: manifests/extras.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost
    - resource: deploy/debug-tool
      namespace: outpost

teardown:
  keepCluster: false
