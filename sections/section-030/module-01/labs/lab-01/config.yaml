# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Diagnosing Orchestration Failures (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-038-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0
      - busybox:1.37.0

# Starting state: a healthy scout and shuttle, and six faulty Deployments.
# The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the healthy workloads and the six faulty Deployments
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: lander-and-hauler-scheduled
      description: lander and hauler are scheduled and available
      type: file
      source: validation/validate-lander-and-hauler-scheduled.sh
      hint: Read the FailedScheduling event of each pod. One asks for a node label no node has. The other asks for more CPU than the node has. Change the Deployments, not the node.
    - name: tanker-image-pulls
      description: tanker pulls its image and is available
      type: file
      source: validation/validate-tanker-image-pulls.sh
      hint: The event on the pod names the image that fails. Check which tags exist for podinfo and use 6.15.0.
    - name: rover-stays-running
      description: rover keeps running and does not restart
      type: file
      source: validation/validate-rover-stays-running.sh
      hint: The container exits with code 1 after printing an error. Replace the command with one that keeps the process running.
    - name: miner-not-oomkilled
      description: miner is available and no container was OOMKilled
      type: file
      source: validation/validate-miner-not-oomkilled.sh
      hint: The last terminated state of the container says OOMKilled. Raise the memory limit of the miner container.
    - name: warden-ready
      description: warden passes its readiness probe
      type: file
      source: validation/validate-warden-ready.sh
      hint: The pod is Running but not Ready. The readiness probe calls a path that returns an error. podinfo serves /readyz.
    - name: workloads-not-removed
      description: All Deployments still run at least one replica and scout is untouched
      type: file
      source: validation/validate-workloads-not-removed.sh
      hint: Do not scale a Deployment to zero or delete it. This check passes before any change, because scout is healthy, and it fails if a fix removes a workload.

teardown:
  keepCluster: false
