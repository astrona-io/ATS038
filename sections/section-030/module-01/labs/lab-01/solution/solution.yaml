# Six Deployments that fail on purpose. Each one stops at a different stage
# of the Pod lifecycle.
#
# Reference solution: the six faulty Deployments, fixed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lander
  namespace: starfleet
  labels:
    app: lander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lander
  template:
    metadata:
      labels:
        app: lander
    spec:
      containers:
        - name: lander
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
