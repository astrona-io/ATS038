# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Diagnosing Cluster Services (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-038-lab-030-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: healthy scout, shuttle and drifter, and three faults:
# a Service with no endpoints, a Service with the wrong target port and a pod
# that needs a missing ConfigMap. The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the healthy workloads and the three faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: probe-service-has-endpoints
      description: The probe Service has an endpoint and shuttle reaches it
      type: file
      source: validation/validate-probe-service-has-endpoints.sh
      hint: Compare the selector of the Service with the labels of the probe pod. List the EndpointSlice of the Service to see that it is empty.
    - name: relay-service-forwards
      description: shuttle reaches relay through its Service
      type: file
      source: validation/validate-relay-service-forwards.sh
      hint: The Service has endpoints but the connection is refused. Compare the Service targetPort with the port the container listens on.
    - name: lander-starts
      description: lander starts and is available
      type: file
      source: validation/validate-lander-starts.sh
      hint: The pod status names the missing ConfigMap. Create lander-config in starfleet with the key LANDING_MODE.
    - name: backends-untouched
      description: scout still works and the probe and relay Deployments are unchanged
      type: file
      source: validation/validate-backends-untouched.sh
      hint: Change the Services and add the ConfigMap only. This check passes before any change and fails if you edit the probe or relay pod labels or ports.

teardown:
  keepCluster: false
