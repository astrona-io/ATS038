# Reference solution: correct selector and target port, and the missing ConfigMap.
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: starfleet
spec:
  selector:
    app: relay
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lander-config
  namespace: starfleet
data:
  LANDING_MODE: automatic
