# Capstone starting state in the namespace `orbit`. Four applications fail at
# different stages and one client (shuttle) is healthy.
#
# beacon - image tag does not exist, and the Service targetPort is wrong
# signal - CPU request larger than the node                  -> Pending
# relay  - liveness probe path returns 404                    -> restarts again and again
# cargo  - env value from a Secret that does not exist        -> CreateContainerConfigError
apiVersion: v1
kind: Namespace
metadata:
  name: orbit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: orbit
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: orbit
  labels:
    app: beacon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      containers:
        - name: beacon
          image: ghcr.io/stefanprodan/podinfo:6.15.999
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: beacon
  namespace: orbit
spec:
  selector:
    app: beacon
  ports:
    - name: http
      port: 80
      targetPort: 9999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal
  namespace: orbit
  labels:
    app: signal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal
  template:
    metadata:
      labels:
        app: signal
    spec:
      containers:
        - name: signal
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          resources:
            requests:
              cpu: "100"
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: orbit
  labels:
    app: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          livenessProbe:
            httpGet:
              path: /livez-check
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo
  namespace: orbit
  labels:
    app: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cargo
  template:
    metadata:
      labels:
        app: cargo
    spec:
      containers:
        - name: cargo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          env:
            - name: CARGO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cargo-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
