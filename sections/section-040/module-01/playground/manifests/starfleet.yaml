# Starting state: the `scout` Deployment with three kinds of non-persistent
# volume, in `starfleet`, plus the empty namespace `outpost`.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scout-config
  namespace: starfleet
data:
  mode: patrol
  interval: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: scout-token
  namespace: starfleet
type: Opaque
stringData:
  token: scout-demo-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: busybox:1.37
          # Exits with an error when /tmp/crash exists. The file lives in the
          # container layer, so the restarted container does not have it.
          command:
            - sh
            - -c
            - |
              while true; do
                if [ -e /tmp/crash ]; then exit 1; fi
                sleep 1
              done
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: config
              mountPath: /etc/scout
            - name: token
              mountPath: /etc/scout-secret
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: scratch
          emptyDir: {}
        - name: config
          configMap:
            name: scout-config
        - name: token
          secret:
            secretName: scout-token
