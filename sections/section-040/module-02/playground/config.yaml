# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Storage Decisions (PLAYGROUND) — playground environment.
# A clean sandbox: it starts, applies a dynamically provisioned claim and the
# Deployment that uses it, then stays running for free exploration.
# No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-038-playground-040-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - busybox:1.37

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
