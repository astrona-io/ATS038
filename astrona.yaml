        path: sections/section-010/module-01/course-03-dns-and-service-discovery-in-practice.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Pod Networking Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: networking
        task_kind: build
        tags: [pod-ip, coredns, headless-service, externalname]
        learning_goals:
          - Read a Pod IP address and record it
          - Create a headless Service that resolves to Pod addresses
          - Create an ExternalName Service that makes a short name resolve across namespaces
        resources:
          - name: "Kubernetes cluster networking"
            url: https://kubernetes.io/docs/concepts/cluster-administration/networking/
          - name: "DNS for Services and Pods"
            url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
