        estimated_duration: 20m
        topic: networking
        task_kind: build
        tags: [service, selector, endpointslice, nodeport, ingress]
        learning_goals:
          - Fix a Service whose selector and targetPort are wrong
          - Expose an application through a NodePort Service
          - Write an Ingress that routes a host name to a Service
        resources:
          - name: "Service"
            url: https://kubernetes.io/docs/concepts/services-networking/service/
          - name: "EndpointSlices"
            url: https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/
          - name: "Ingress"
            url: https://kubernetes.io/docs/concepts/services-networking/ingress/
