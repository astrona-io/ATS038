        title: "Volumes And Application State Lab"
        path: sections/section-040/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: storage
        task_kind: troubleshooting
        tags: [persistentvolumeclaim, storageclass, volumes, dynamic-provisioning, deployment]
        learning_goals:
          - Create a claim and mount it in a Deployment so its data survives a Pod replacement
          - Explain why a claim naming a missing StorageClass stays Pending
          - Re-create a claim with an existing StorageClass because the class of a claim cannot be changed
        resources:
