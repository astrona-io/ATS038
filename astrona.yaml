        path: sections/section-040/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: storage
        task_kind: build
        tags: [persistentvolume, reclaim-policy, retain, hostpath, static-provisioning]
        learning_goals:
          - Create a static PersistentVolume with the Retain policy and bind a claim to it
          - Patch the volume behind a dynamically provisioned claim from Delete to Retain
          - Explain what a Retain volume does after its claim is deleted
        resources:
          - name: "Kubernetes persistent volumes"
            url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
          - name: "Change the reclaim policy of a PersistentVolume"
            url: https://kubernetes.io/docs/tasks/administer-cluster/change-pv-reclaim-policy/
      - type: reading
        title: "Expansion, Snapshots And Data Protection"
        path: sections/section-040/module-02/course-03-expansion-snapshots-and-data-protection.md
      - type: reading
        title: Summary
        path: sections/section-040/module-02/course-04-summary.md

