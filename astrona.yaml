          - Limit access to an application with a NetworkPolicy
        resources:
          - name: "Service"
            url: https://kubernetes.io/docs/concepts/services-networking/service/
          - name: "Network policies"
            url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
      - type: quiz
        title: "Knowledge Check: Networking"
        path: sections/section-010/quiz.yaml
        pass_score: 70
# Paste into astrona.yaml as one module entry. Paths are relative to the repository root.
