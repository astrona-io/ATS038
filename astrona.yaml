      - type: reading
        title: Service Types And Node Access
        path: sections/section-010/module-02/course-02-service-types-and-node-access.md
      - type: reading
        title: External Entry And Application Routing
        path: sections/section-010/module-02/course-03-external-entry-and-application-routing.md
      - type: reading
        title: Question
        path: sections/section-010/module-02/labs/lab-01/question.md
