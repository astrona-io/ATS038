        estimated_duration: 20m
        topic: access-control
        task_kind: troubleshooting
        tags: [rbac, role, rolebinding, clusterrolebinding, serviceaccount, least-privilege, auth-can-i]
        learning_goals:
          - Fix a Role that names the wrong API group
          - Replace a cluster-wide binding with a RoleBinding in one namespace
          - Stop a pod from mounting a ServiceAccount token it does not use
