        estimated_duration: 25m
        topic: network-policy
        task_kind: build
        tags: [networkpolicy, ingress, egress, dns]
        learning_goals:
          - Allow only one client Pod to reach a backend with an ingress NetworkPolicy
          - Restrict the egress of a client Pod and keep DNS working
        resources:
          - name: "Network policies"
            url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
      - type: reading
