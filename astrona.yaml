  - id: module-020
    title: "Security"
    description: >
      Makes the reader able to explain who may do what in the Kubernetes API
      and what a pod may do on its node: authentication, authorization and
      admission, ServiceAccounts, RBAC, security contexts, Pod Security
      admission, Secrets and image checks.
    content:
      - type: reading
        title: Section Overview
        path: sections/section-020/README.md

      - type: reading
        title: "Identity And Access"
