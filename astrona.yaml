# Hands-on course: readings, playgrounds (shown by each landing page's marker), graded labs, capstones and quizzes. All labs are UNTESTED (static checks only).
training:
  id: ATS038
  title: 'KCNA: Container Orchestration'
  description: Concept lessons, diagrams, kind-based playgrounds, graded labs, section capstones and original
    scenario quizzes covering every published objective in this KCNA domain.
  certification:
    name: Kubernetes and Cloud Native Associate
    code: KCNA
    provider: CNCF / Linux Foundation
    domain: Container Orchestration
    weight: 28
    competencies:
    - Networking
    - Security
    - Troubleshooting
    - Storage
modules:
  - id: module-intro
    title: Introduction
    description: Audience, learning approach, reading requirements and contribution process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
    - type: reading
      title: Welcome To The Course
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: Get Your Machine Ready
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: How This Course Is Made
      path: sections/intro/course-03-how-this-course-is-made.md
  - id: module-010
    title: "Networking"
    description: >
      Makes the reader able to explain how Pods, Services and external clients
      reach each other in a Kubernetes cluster, and how traffic is limited:
      Pod addresses and the network plugin, cluster DNS, Services and their
      endpoints, Ingress and the Gateway API, NetworkPolicy, service meshes and
      TLS certificates.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md
      - type: reading
        title: Pod Networking
        path: sections/section-010/module-01/course.md
