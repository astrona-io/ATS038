  - id: module-030
    title: "Troubleshooting"
    description: >
      Makes the reader able to find why a Kubernetes workload does not work
      and fix it with one targeted change: pods that stay Pending, image pull
      and crash failures, out-of-memory kills, failing probes, node
      conditions, missing dependencies, Services with no endpoints or the
      wrong port, and DNS resolution. Every module has a playground with
      seeded faults and a graded lab, and the section closes with a capstone.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-030/README.md

      - type: reading
        title: "Diagnosing Orchestration Failures"
        path: sections/section-030/module-01/course.md
      - type: reading
        title: "Placement And Dependency Evidence"
        path: sections/section-030/module-01/course-01-placement-and-dependency-evidence.md
      - type: reading
        title: "Image Preparation And Container Startup"
        path: sections/section-030/module-01/course-02-image-preparation-and-container-startup.md
      - type: reading
        title: "Probes And Safe Corrective Changes"
        path: sections/section-030/module-01/course-03-probes-and-safe-corrective-changes.md
      - type: reading
        title: Question
        path: sections/section-030/module-01/labs/lab-01/question.md
      - type: lab
        title: "Diagnosing Orchestration Failures Lab"
        path: sections/section-030/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: troubleshooting
        task_kind: troubleshooting
        tags: [pending, nodeselector, resource-requests, imagepullbackoff, crashloopbackoff, oomkilled, readiness-probe, kubectl-describe]
        learning_goals:
          - Read FailedScheduling events and fix a node selector and a CPU request that no node can satisfy
          - Fix an image tag, a crashing command and a memory limit from the container state and exit code
          - Correct a readiness probe path so a running pod becomes Ready
        resources:
          - name: "Debug Pods"
            url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
          - name: "Configure liveness, readiness and startup probes"
            url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
      - type: reading
        title: Summary
        path: sections/section-030/module-01/course-04-summary.md

      - type: reading
        title: "Diagnosing Cluster Services"
        path: sections/section-030/module-02/course.md
      - type: reading
        title: "Node Health And Shared Dependencies"
        path: sections/section-030/module-02/course-01-node-health-and-shared-dependencies.md
      - type: reading
        title: "Tracing A Service Request"
        path: sections/section-030/module-02/course-02-tracing-a-service-request.md
      - type: reading
        title: "DNS Resolution And Debug Containers"
        path: sections/section-030/module-02/course-03-dns-resolution-and-debug-containers.md
      - type: reading
        title: Question
        path: sections/section-030/module-02/labs/lab-01/question.md
      - type: lab
        title: "Diagnosing Cluster Services Lab"
        path: sections/section-030/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: troubleshooting
        task_kind: troubleshooting
        tags: [service, selector, endpointslice, targetport, configmap, dns, curl-exit-code]
        learning_goals:
          - Fix a Service selector that matches no pod by comparing it with the pod labels and the EndpointSlice
          - Fix a Service target port that the container does not listen on
          - Create the missing ConfigMap that keeps a pod from creating its container
        resources:
          - name: "Debug Services"
            url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
          - name: "Debugging DNS resolution"
            url: https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
      - type: reading
        title: Summary
        path: sections/section-030/module-02/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-030/capstone/labs/lab-01/question.md
      - type: lab
        title: "Troubleshooting Capstone"
        path: sections/section-030/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 30m
        topic: troubleshooting
        task_kind: troubleshooting
        tags: [imagepullbackoff, service, targetport, pending, liveness-probe, secret, createcontainerconfigerror]
        learning_goals:
          - Find and fix two faults in a row, an image tag and a Service target port, for one application
          - Fix an unschedulable resource request and a failing liveness probe
          - Create the missing Secret that blocks a container from being created
        resources:
          - name: "Debug Pods"
            url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
          - name: "Debug Services"
            url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
      - type: quiz
        title: "Knowledge Check: Troubleshooting"
        path: sections/section-030/quiz.yaml
        pass_score: 70
  - id: module-040
    title: "Storage"
    description: >
      Makes the reader able to decide where application data lives and
      what happens to it: the lifetimes of container, ephemeral and
      persistent storage, PersistentVolumes, claims, StorageClasses and
      CSI drivers, access modes and volume modes, reclaim policies,
      StatefulSet claim templates, and the difference between
      persistence, replication and backup.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-040/README.md

      - type: reading
        title: "Volumes And Application State"
        path: sections/section-040/module-01/course.md
